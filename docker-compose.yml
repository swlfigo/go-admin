# Go Admin · 一键本地部署
#   docker compose up -d --build
# 访问：http://localhost:8088   默认账号 admin / admin123
# 镜像全部本地构建，仅拉取公共基础镜像（postgres/golang/node/nginx），无需 DockerHub 账号。

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      GOADMIN_DATABASE_HOST: db
      # ⚠️ 生产务必改这两个：
      GOADMIN_JWT_SECRET: "change-me-in-production-please-at-least-32-bytes"
      # GOADMIN_ADMIN_PASSWORD: "your-strong-password"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:

server:
  port: 8080
database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  name: go_admin
  sslmode: disable
jwt:
  # ⚠️ 生产务必换成强随机串（泄露 = 任何人可伪造登录）
